name: Reusable Echo Workflow

on:
  workflow_call:
    inputs:
      message:
        description: 'Message to echo'
        required: true
        type: string

jobs:
  echo-message:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        environment: [dev, staging, prod]
    steps:
      - name: Echo the message
        run: |
          echo "Environment: ${{ matrix.environment }}"
          echo "Message: ${{ inputs.message }}"
